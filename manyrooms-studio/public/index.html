<html xmlns="http://www.w3.org/1999/xhtml" lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>ManyRooms - Creative Spaces</title>
	
	<style type="text/css">
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		body {
			background: #FF6B6B;
			font-family: 'Inter', 'Poppins', sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			overflow: hidden;
		}
		
		.dots-container {
			display: flex;
			justify-content: center;
			gap: 12px;
			animation: fadeIn 0.4s ease forwards;
			opacity: 0;
		}
		
		.dot {
			width: 14px;
			height: 14px;
			border-radius: 50%;
			background: #fff;
			animation: dotBounce 1.2s ease-in-out infinite;
		}
		
		.dot:nth-child(1) { animation-delay: 0s; }
		.dot:nth-child(2) { animation-delay: 0.15s; }
		.dot:nth-child(3) { animation-delay: 0.3s; }
		.dot:nth-child(4) { animation-delay: 0.45s; }
		.dot:nth-child(5) { animation-delay: 0.6s; }
		
		@keyframes dotBounce {
			0%, 80%, 100% {
				transform: scale(0.6);
				opacity: 0.3;
			}
			40% {
				transform: scale(1);
				opacity: 1;
			}
		}
		
		@keyframes fadeIn {
			to {
				opacity: 1;
			}
		}
	</style>
	
	<meta HTTP-EQUIV="Refresh" CONTENT="1.5; URL=./wp.aqlova.com/pixora/creative-agency-classic/digital-studio/index.html">
</head>

<body>
	<div class="dots-container">
		<div class="dot"></div>
		<div class="dot"></div>
		<div class="dot"></div>
		<div class="dot"></div>
		<div class="dot"></div>
	</div>
</body>

</html>
